name: Ozero kernel build and boot checks

on:
  push:
    branches: [main, 'kilo/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86_64-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential binutils curl xorriso qemu-system-x86
      - name: Compile developer tooling
        run: python -m compileall -q tools
      - name: Check host readiness
        run: make doctor
      - name: Build ELF64 kernel and bootable ISO
        run: make check
      - name: Verify ELF header and save disassembly
        run: |
          readelf -h build/kernel.elf
          objdump -d -Mintel build/kernel.elf > build/kernel.disasm.txt
      - name: Boot kernel with generic x86-64 CPU
        env:
          QEMU_CPU: qemu64
          QEMU_DEBUG_LOG: build/qemu-debug-qemu64.log
        run: bash tools/qemu-smoke.sh build/ozero.iso build/qemu-serial-qemu64.log
      - name: Boot kernel with Intel Haswell CPU model
        env:
          QEMU_CPU: Haswell-v1
          QEMU_DEBUG_LOG: build/qemu-debug-haswell.log
        run: bash tools/qemu-smoke.sh build/ozero.iso build/qemu-serial-haswell.log
      - name: Upload QEMU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozero-qemu-diagnostics
          path: |
            build/qemu-serial-*.log
            build/qemu-debug-*.log
            build/kernel.disasm.txt
          if-no-files-found: warn
          retention-days: 7
