name: Ozero kernel build and boot checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86_64-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential binutils curl xorriso qemu-system-x86
      - name: Compile developer tooling
        run: python -m compileall -q tools
      - name: Check host readiness
        run: make doctor
      - name: Build ELF64 kernel and bootable ISO
        run: make check
      - name: Verify ELF header
        run: readelf -h build/kernel.elf
      - name: Boot kernel in QEMU and verify serial milestones
        run: bash tools/qemu-smoke.sh
